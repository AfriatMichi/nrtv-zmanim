name: Fetch zmanim

on:
  schedule:
    # Every two hours, at :30 past the even hours (UTC).
    # In Israel that lands on 01:30, 03:30, 05:30 ... so a run always
    # follows midnight - the new day's zmanim are picked up within 2h -
    # and several runs precede שחרית.
    - cron: '30 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zmanim
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape
        run: python scrape_zmanim.py

      - name: Commit result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No change in zmanim."
          else
            git commit -m "zmanim: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmanim
          path: data/zmanim.json
          if-no-files-found: warn
