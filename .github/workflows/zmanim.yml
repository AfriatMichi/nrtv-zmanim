name: Fetch zmanim

on:
  schedule:
    # Every two hours, at :30 past the even hours (UTC).
    # In Israel that lands on 01:30, 03:30, 05:30 ... so a run always
    # follows midnight - the new day's zmanim are picked up within 2h -
    # and several runs precede שחרית.
    - cron: '30 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zmanim
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape
        run: python scrape_zmanim.py

      - name: Commit result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data

          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          # scraped_at and the live countdown move on every single run, so
          # neither is a change worth a commit. Count the changed lines that
          # are something else; if there are none, leave the repo alone. The
          # raw URL still serves current times - the content is identical.
          diff=$(git diff --staged -U0 -- data | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
          real=$(printf '%s' "$diff" | grep -c -vE '"(scraped_at|countdown)"' || true)
          real=${real:-0}

          if [ "$real" -eq 0 ]; then
            echo "Only the timestamp moved - not committing."
            exit 0
          fi

          echo "$real changed line(s) beyond the timestamp."
          git commit -m "zmanim: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmanim
          path: data/zmanim.json
          if-no-files-found: warn
